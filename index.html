<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Transaction Spiels</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="top-bar">

      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search spiel title..."
        >
      </div>

      <button
        id="addSpielBtn"
        class="add-btn"
        onclick="openModal()"
        style="display:none;"
      >
        + Add Spiel
      </button>

      <button
        id="authBtn"
        class="auth-btn"
      >
        Admin Login
      </button>

    </div>

    <div
      class="spiel-grid"
      id="spielGrid"
    ></div>

  </div>

  <!-- =========================
       ADD SPIEL MODAL
  ========================= -->

  <div
    class="modal"
    id="modal"
  >

    <div class="modal-content">

      <h2 id="modalTitle">Add Spiel</h2>

      <input
        type="text"
        id="spielTitle"
        placeholder="Spiel Title"
      >

      <textarea
        id="spielText"
        placeholder="Write your canned spiel here..."
      ></textarea>

      <button
        class="save-btn"
        onclick="saveSpiel()"
      >
        Save Spiel
      </button>

    </div>

  </div>

  <!-- =========================
       LOGIN MODAL
  ========================= -->

  <div
    class="modal"
    id="loginModal"
  >

    <div class="modal-content login-modal-content">

      <h2 class="login-title">
        Admin Login
      </h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email Address"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <div class="login-actions">

        <button
          class="login-btn"
          onclick="loginAdmin()"
        >
          Login
        </button>

        <button
          class="close-login-btn"
          onclick="closeLoginModal()"
        >
          Cancel
        </button>

      </div>

    </div>

  </div>

  <!-- =========================
       DELETE MODAL
  ========================= -->

  <div
    class="modal"
    id="deleteModal"
  >

    <div class="modal-content delete-modal-content">

      <h2>Delete Spiel</h2>

      <p class="delete-text">
        Are you sure you want to delete this spiel?
      </p>

      <div class="delete-actions">

        <button
          class="cancel-btn"
          onclick="closeDeleteModal()"
        >
          Cancel
        </button>

        <button
          class="confirm-delete-btn"
          onclick="confirmDelete()"
        >
          Delete
        </button>

      </div>

    </div>

  </div>

  <script
    type="module"
    src="script.js"
  ></script>

</body>
</html>
